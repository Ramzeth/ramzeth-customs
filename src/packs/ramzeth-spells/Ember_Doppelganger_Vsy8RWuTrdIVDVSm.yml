name: Ember Doppelgänger
system:
  description:
    gm: ''
    value: >-
      <p>Sending forth swirls of fire and smoke, you summon a magical glowing
      being in an unoccupied space that resembles your form, though not your
      features. This duplicate is a creature created from the ashes of battle
      and glowing embers, dressed in a cloak of smoke. It has AC 10; 50 Hit
      Points; is immune to critical hits, precision damage, and the
      @UUID[Compendium.pf2e.conditionitems.Item.eIcWbB5o3pP6OIMe]{Immobilized},
      @UUID[Compendium.pf2e.conditionitems.Item.j91X7x0XSomq8d60]{Prone}, and
      @UUID[Compendium.pf2e.conditionitems.Item.VcDeM8A5oI6VqhbM]{Restrained}
      conditions; and has weakness 10 to cold and water. This creature doesn't
      provide or benefit from flanking and automatically fails all skill checks
      and saving throws, and all skill checks attempted against it
      automatically succeed. When you Cast the Spell and the first time you
      Sustain it each turn on subsequent rounds, the duplicate Strides up to 30
      feet and launches a blast of fire in a @Template[type:burst|distance:10]
      up to 30 feet away. Each creature in the burst takes 6d6 fire damage with
      a basic Reflex saving throw, using your spell DC.</p>

      <p>@Template[line|distance:5]{Summon Ember Hussar}</p>

      <hr>

      <p><strong>Heightened (+1)</strong> The duplicate has an additional 10
      Hit Points, and the damage increases by 1d6.</p>
