name: Sliding Blocks
system:
  description:
    gm: ''
    value: >-
      <p>You conjure up to six 5-foot stone cubes you can gently move with a
      gesture. Each cube appears in any space within range, and they're capable
      of levitating. If you conjure a cube in an occupied space or in a space
      that can't accommodate it, it fails to appear. Each 5-foot cube can be
      Climbed with a successful @Check[athletics|dc:10] check and has AC 10,
      Hardness 10, and 40 Hit Points. If any of the cubes is ever farther away
      from you than the range of this spell, it immediately crumbles into
      dust.</p>

      <p>Each time you Sustain this spell, you can move up to two of the
      conjured cubes up to 10 feet each in any direction, including vertically.
      You can choose different cubes to move each time you Sustain.</p>

      <p>@Template[line|distance:5]{Place Block}</p>

      <p data-visibility="gm"><a data-action="clear" class="rc-blocks">Remove
      Blocks</a></p>

      <hr>

      <p><strong>Heightened (+2)</strong> The cubes have 10 additional Hit
      Points, and you can move the chosen cubes an additional 5 feet each time
      you Sustain this Spell.</p>
